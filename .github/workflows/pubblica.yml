# Costruisce l'app e la pubblica su GitHub Pages a ogni modifica del ramo "main".
# Indirizzo: https://<organizzazione>.github.io/<nome-repository>/
#
# Chiavi da inserire in: Settings -> Secrets and variables -> Actions -> New repository secret
#   VITE_SUPABASE_URL      Project URL di Supabase
#   VITE_SUPABASE_ANON_KEY chiave anon / publishable di Supabase (MAI quella secret)
#   VITE_VAPID_PUBLIC_KEY  (facoltativa) chiave pubblica per le notifiche
# Una volta sola: Settings -> Pages -> Source: "GitHub Actions"
name: Pubblica l'app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - name: Controllo chiavi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          mancanti=""
          for k in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            [ -n "${!k}" ] || mancanti="$mancanti $k"
          done
          if [ -n "$mancanti" ]; then
            echo "::error::Mancano queste chiavi nei Secrets del repository:$mancanti"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa
        run: npm ci

      - name: Costruisci l'app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
